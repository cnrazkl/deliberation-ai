packages:
  - apps/*
  - packages/*

overrides:
  # GHSA-68fv-2mgg-jv7q: patch every transitive source-map consumer.
  "source-map-js": "1.2.2"
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  # DA-103: Next 16.3.6 only consumes globSync(..., { onlyDirectories: true }).
  # Keep this version-scoped and run test:lint-dependencies before upgrades.
  "@next/eslint-plugin-next@16.3.6>fast-glob": "npm:tinyglobby@0.2.17"

minimumReleaseAgeExclude:
  - pg-boss@12.33.0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  '@next/eslint-plugin-next@16.3.6': patches/@next__eslint-plugin-next@16.3.6.patch
