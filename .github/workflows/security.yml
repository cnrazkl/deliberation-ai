name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=moderate
      - name: Install reviewed dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify frozen knowledge preparation
        run: |
          pnpm exec vitest run packages/evaluation/src/knowledge-evaluation.test.ts
          pnpm exec vitest run packages/evaluation/src/knowledge-benchmark.test.ts
          pnpm exec vitest run packages/evaluation/src/knowledge-format-review.test.ts
          pnpm exec vitest run packages/evaluation/src/knowledge-format-adjudication.test.ts
          pnpm exec vitest run packages/evaluation/src/knowledge-review-attestation.test.ts
          pnpm knowledge:status
          pnpm knowledge:review-status
      - name: Verify scoped knowledge boundary
        run: pnpm exec vitest run packages/application/src/knowledge.test.ts packages/application/src/knowledge-packet.test.ts packages/contracts/src/evidence-candidates.test.ts packages/contracts/src/evidence-publications.test.ts apps/web/src/lib/markdown-export.test.ts
      - name: Verify local source integrity and frozen extraction
        run: |
          pnpm exec vitest run packages/domain/src/knowledge.test.ts packages/retrieval/src/knowledge-files.test.ts
          pnpm knowledge:extraction:verify
      - name: Check lint dependency compatibility
        run: pnpm test:lint-dependencies
      - name: Verify offline NVIDIA hosted boundary
        run: pnpm exec vitest run packages/providers/src/nvidia-provider.test.ts
      - name: Verify knowledge query limits
        run: pnpm exec vitest run packages/contracts/src/knowledge-query.test.ts
      - name: Verify offline worker migration history gate
        run: pnpm exec vitest run packages/persistence/src/migration-compatibility.test.ts
      - name: Verify offline local diagnostics warnings
        run: pnpm exec vitest run apps/web/src/lib/local-diagnostics-alerts.test.ts
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          cd "$scan_dir"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scan_dir/gitleaks" git . --config .gitleaks.toml --redact --no-banner --log-opts='--all'
